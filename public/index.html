<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狼人殺發言轉盤</title>
<meta name="description" content="狼人殺開局用：輸入人數，轉盤 3 秒決定從幾號開始、順時針或逆時針發言。">
<meta name="theme-color" content="#0b0f22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&family=Noto+Sans+TC:wght@500;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b12;
  --night:#0b0f22;
  --night2:#1b2550;
  --blood:#c4202f;
  --blood-dk:#6e0d17;
  --moon:#f6e7b0;
  --gold:#f5b81c;
  --bone:#efe3c8;
  --paper:#f3ead2;
  --display:"Noto Sans TC",system-ui,sans-serif;
  --serif:"Noto Serif TC",serif;
  --comic:"Bangers","Noto Sans TC",system-ui,sans-serif;
  --digits:"Luckiest Guy","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;overflow-x:clip}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--night);color:var(--bone);
  font-family:var(--display);font-weight:500;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ───────── 夜空與村莊 ───────── */
.sky{position:fixed;inset:0;z-index:-5;
  background:radial-gradient(ellipse 80% 60% at 78% 12%,#3a4c96 0%,#1b2550 38%,#0b0f22 78%);}
.stars{position:fixed;inset:0;z-index:-4;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff8dc;
  animation:twinkle var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s);opacity:.8}
@keyframes twinkle{50%{opacity:.15;transform:scale(.6)}}
.moon{position:absolute;z-index:-3;top:clamp(18px,5vh,60px);right:clamp(-40px,6vw,120px);
  width:clamp(150px,22vw,280px);aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 30% 34%,rgba(170,140,80,.35) 0 9%,transparent 10%),
    radial-gradient(circle at 62% 58%,rgba(170,140,80,.3) 0 13%,transparent 14%),
    radial-gradient(circle at 70% 26%,rgba(170,140,80,.28) 0 6%,transparent 7%),
    radial-gradient(circle at 38% 72%,rgba(170,140,80,.25) 0 7%,transparent 8%),
    radial-gradient(circle at 40% 38%,#fffbe6 0%,#f6e7b0 55%,#e3c977 100%);
  box-shadow:0 0 60px 18px rgba(246,231,176,.35),0 0 180px 60px rgba(120,150,255,.18);
  border:4px solid var(--ink);}
.moon{transition:box-shadow 1.2s ease}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity 1.4s ease;
  background:radial-gradient(circle at 30% 34%,rgba(60,0,0,.35) 0 9%,transparent 10%),
    radial-gradient(circle at 62% 58%,rgba(60,0,0,.3) 0 13%,transparent 14%),
    radial-gradient(circle at 40% 38%,#ff8a5c 0%,#d42a2a 50%,#6e0a12 100%)}
.blood .moon{box-shadow:0 0 70px 24px rgba(255,60,40,.45),0 0 200px 80px rgba(180,0,20,.3);transition-duration:.6s}
.blood .moon::before{opacity:1;transition-duration:.6s}
.sky::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;
  background:radial-gradient(ellipse 80% 60% at 78% 12%,rgba(170,20,30,.55),rgba(80,0,10,.35) 50%,transparent 85%)}
.blood .sky::after{opacity:1;transition-duration:.6s}
.hub-blood{opacity:0;transition:opacity 1.4s ease;mix-blend-mode:multiply}
.blood .hub-blood{opacity:.85;transition-duration:.6s}
.blood .eyes-glint circle{r:4.2;fill:#ff5a3a}
.moon::after{content:"";position:absolute;inset:-4px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,0,0,.28) 1.1px,transparent 1.5px) 0 0/7px 7px;
  -webkit-mask:radial-gradient(circle at 30% 30%,transparent 40%,#000 85%);
          mask:radial-gradient(circle at 30% 30%,transparent 40%,#000 85%);}
.cloud{position:absolute;z-index:-3;height:38px;border-radius:40px;background:#0e1430;border:3px solid var(--ink);
  box-shadow:inset 0 -8px 0 #0a0e24;animation:drift linear infinite;opacity:.92}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border:inherit;border-bottom:none;border-radius:50%}
.cloud::before{width:44%;height:150%;left:14%;bottom:30%}
.cloud::after{width:30%;height:110%;left:52%;bottom:40%}
@keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-60vw)}}
.village{position:fixed;left:0;right:0;bottom:0;z-index:-2;width:100%;height:clamp(150px,30vh,320px);pointer-events:none}
.fog{position:fixed;left:-10%;right:-10%;bottom:-4vh;height:22vh;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 40% 60% at 25% 70%,rgba(150,165,220,.22),transparent 70%),
             radial-gradient(ellipse 35% 55% at 75% 80%,rgba(150,165,220,.18),transparent 70%);
  animation:fog 18s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(6%)}}
.halftone{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle,rgba(0,0,0,.22) 1px,transparent 1.4px) 0 0/6px 6px;mix-blend-mode:multiply}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.65) 100%)}
.eyes-glint{animation:blink 6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,44%,52%,100%{opacity:1;transform:scaleY(1)}48%{opacity:.2;transform:scaleY(.1)}}

/* ───────── 主版面 ───────── */
main{position:relative;z-index:1;max-width:1240px;margin:0 auto;
  padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;position:relative}
.judge-link{margin-right:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  font-weight:900;font-size:15px;padding:6px 12px;text-decoration:none;letter-spacing:.06em;transform:rotate(-2deg)}
.judge-link:active{transform:rotate(-2deg) translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
/* 背景音樂：狼頭喇叭 */
.bgm-btn{width:56px;height:56px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);position:relative}
.bgm-btn svg{width:44px;height:44px}
.bgm-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.bgm-btn .wave,.bgm-btn .note{display:none}
.bgm-btn .mute{display:block}
.bgm-btn.on .wave,.bgm-btn.on .note{display:block}
.bgm-btn.on .mute{display:none}
.bgm-btn.on{background:#ffd23f}
.bgm-btn.playing .wave{animation:wavepulse 1.2s ease-in-out infinite}
.bgm-btn.playing .wave:nth-of-type(2){animation-delay:.25s}
@keyframes wavepulse{50%{opacity:.25}}
.bgm-hint{position:absolute;right:120px;top:50%;transform:translateY(-50%) rotate(-2deg);background:#fff;color:var(--ink);
  border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
.bgm-hint::after{content:"";position:absolute;right:-13px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:12px solid var(--ink);border-right:0}
.bgm-hint[hidden]{display:none}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:50%}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.icon-btn svg{width:22px;height:22px}

header{text-align:center;margin:-8px 0 10px}
.kicker{display:inline-block;background:var(--paper);color:var(--ink);font-weight:900;
  padding:4px 14px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  transform:rotate(-2deg);font-size:clamp(14px,2.4vw,18px);letter-spacing:.12em}
h1{margin:10px 0 4px;font-family:var(--display);font-weight:900;line-height:1.05;
  font-size:clamp(46px,9vw,100px);letter-spacing:.04em;color:#ffd23f;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:4px 4px 0 var(--blood),8px 8px 0 var(--ink);transform:rotate(-1deg)}
h1 .drip{color:#fff2c4}
.subtitle{font-family:var(--serif);font-weight:700;font-size:clamp(15px,2.6vw,20px);color:#e3e7ff;margin:8px 0 0;
  text-shadow:0 2px 0 var(--ink),0 0 10px rgba(5,6,20,.95),0 0 22px rgba(5,6,20,.8)}

.stage{display:grid;grid-template-columns:1fr minmax(300px,520px) 1fr;gap:clamp(12px,3vw,40px);align-items:center;margin-top:8px}
.roster{display:grid;gap:18px}
.roster.left{justify-items:end}
.roster.right{justify-items:start}

/* 角色卡 */
.role-card{margin:0;width:min(172px,100%);background:var(--paper);border:4px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);transform:rotate(var(--tilt,0deg));padding:6px 6px 0;
  transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.role-card:hover{transform:rotate(0) translateY(-6px) scale(1.04)}
.role-card svg{display:block;width:100%;height:auto;border:3px solid var(--ink);background:var(--ink)}
.role-card figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:4px 2px 6px;color:var(--ink)}
.role-card b{font-weight:900;font-size:20px;letter-spacing:.06em}
.role-card span{font-family:var(--comic);font-size:15px;letter-spacing:.06em;color:var(--blood)}
.role-card.speaking{animation:speak .5s ease-in-out 4 alternate}
@keyframes speak{to{transform:rotate(0) translateY(-10px) scale(1.06)}}
.is-spinning .role-card{animation:jitter .14s steps(2) infinite}
.is-spinning .role-card:nth-child(2){animation-delay:-.05s}
.is-spinning .role-card:nth-child(3){animation-delay:-.09s}
@keyframes jitter{0%{transform:rotate(var(--tilt)) translate(0,0)}50%{transform:rotate(var(--tilt)) translate(1.5px,-1px)}100%{transform:rotate(var(--tilt)) translate(-1px,1px)}}
main.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}

/* 轉盤 */
.wheel-zone{position:relative;width:100%;aspect-ratio:1;margin:0 auto;max-width:520px}
.wheel-zone > *{position:absolute}
.speed{inset:-16%;width:132%;height:132%;opacity:0;transition:opacity .4s;pointer-events:none}
.spinning .speed{opacity:.55;animation:spinrays 1.2s linear infinite}
@keyframes spinrays{to{transform:rotate(360deg)}}
.orbit{inset:-2%;width:104%;height:104%;opacity:0;transition:opacity .4s;pointer-events:none}
.orbit.show{opacity:1}
.orbit.cw  .orbit-ring{animation:orbit 4s linear infinite}
.orbit.ccw .orbit-ring{animation:orbit 4s linear infinite reverse}
.orbit-ring{transform-origin:center;transform-box:fill-box}
@keyframes orbit{to{transform:rotate(360deg)}}
.wheel-spin{inset:5%;width:90%;height:90%;will-change:transform}
.wheel-spin svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(8px 10px 0 rgba(0,0,0,.55))}
.seg-label{font-family:var(--digits);fill:var(--bone);stroke:var(--ink);paint-order:stroke fill;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}
.seg.win{animation:winglow .7s ease-in-out infinite alternate}
@keyframes winglow{from{filter:brightness(1)}to{filter:brightness(1.6) saturate(1.3)}}
.pointer{left:50%;top:-1.5%;width:14%;transform:translateX(-50%);transform-origin:50% 18%;z-index:3;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.6))}
.hub{left:50%;top:50%;width:28%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:none;padding:0;background:none;z-index:4}
.hub svg{width:100%;height:100%;display:block}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hub:focus-visible{outline:4px dashed var(--gold);outline-offset:6px}

/* 控制台 */
.panel{position:relative;background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);
  max-width:620px;margin:26px auto 0;padding:16px 18px 18px;display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;justify-content:center}
.panel::before{content:"命運之輪";position:absolute;top:-16px;left:14px;background:var(--blood);color:#fff;font-weight:900;
  padding:2px 10px;border:3px solid var(--ink);font-size:14px;letter-spacing:.15em;transform:rotate(-3deg)}
.count{display:flex;align-items:center;gap:10px}
.count label{font-weight:900;font-size:18px;letter-spacing:.08em}
.stepper{display:flex;align-items:stretch;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff}
.stepper button{width:44px;background:var(--bone);border:none;font-family:var(--comic);font-size:30px;line-height:1;color:var(--ink)}
.stepper button:active{background:#e0cfa8}
.stepper input{width:72px;border:none;border-left:3px solid var(--ink);border-right:3px solid var(--ink);text-align:center;
  font-family:var(--digits);font-size:32px;color:var(--blood);padding:4px 0 0;background:#fff;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none;background:#fff7d6}
.chips{display:flex;gap:8px}
.chip{background:#fff;border:3px solid var(--ink);padding:3px 10px;font-weight:900;font-size:15px;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--gold)}
.spin-btn{flex-basis:100%;max-width:360px;background:var(--blood);color:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
  font-weight:900;font-size:clamp(22px,4vw,28px);letter-spacing:.2em;padding:12px 18px;text-shadow:2px 2px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s}
.spin-btn:hover{background:#d92a3a}
.spin-btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.spin-btn:disabled{background:#6d5c5c;cursor:wait}
.spin-btn svg{width:30px;height:30px;flex:none}
.err{flex-basis:100%;text-align:center;margin:-6px 0 0;color:var(--blood);font-weight:900;min-height:0}
.last{flex-basis:100%;text-align:center;margin:-4px 0 0;font-weight:900;color:#4a3d3d;font-size:15px}
.last strong{color:var(--blood);font-family:var(--digits);font-size:22px;letter-spacing:.04em}

/* 漫畫狀聲字 */
.sfx{position:absolute;z-index:5;pointer-events:none;font-family:var(--display);font-weight:900;white-space:nowrap;
  color:#fff2a8;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--blood),7px 7px 0 var(--ink);letter-spacing:.02em}
.sfx-spin{left:-6%;top:6%;font-size:clamp(26px,5vw,44px);transform:rotate(-14deg);opacity:0;transition:opacity .2s}
.spinning .sfx-spin{opacity:1;animation:rattle .16s steps(2) infinite}
@keyframes rattle{0%{transform:rotate(-14deg) translate(0,0)}50%{transform:rotate(-11deg) translate(2px,-2px)}100%{transform:rotate(-16deg) translate(-2px,1px)}}
.sfx-don{left:3%;top:9%;font-size:clamp(46px,11vw,76px);color:#ffd23f;transform:rotate(-12deg);animation:sfxpop .45s cubic-bezier(.2,1.8,.4,1) both .1s}
.sfx-howl{right:3%;top:36%;font-size:clamp(24px,5.5vw,36px);color:#e8ecff;text-shadow:4px 4px 0 #2c4596,7px 7px 0 var(--ink);transform:rotate(9deg);animation:sfxpop .45s cubic-bezier(.2,1.8,.4,1) both .35s}
@keyframes sfxpop{from{opacity:0;scale:.2}to{opacity:1;scale:1}}

/* 揭曉 */
.flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:#fff;opacity:0}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.85}30%{opacity:.5;background:var(--blood)}100%{opacity:0;background:var(--blood)}}
.reveal{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(0,560px);justify-content:center;align-content:center;padding:28px 16px 16px;background:rgba(5,4,10,.72);overflow:hidden}
.reveal[hidden]{display:none}
.reveal-rays{position:absolute;inset:-50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(196,32,47,.55) 0 6deg,transparent 6deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%);
  animation:spinrays 24s linear infinite}
.reveal-wrap{position:relative;width:100%;min-width:0;animation:slam .5s cubic-bezier(.2,1.8,.4,1)}
.reveal-card{position:relative;width:100%;max-height:calc(100dvh - 48px);overflow:auto;
  background:var(--paper);color:var(--ink);border:5px solid var(--ink);box-shadow:12px 12px 0 var(--ink);padding:22px 18px 20px}
@keyframes slam{from{transform:scale(.3) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.reveal-wrap .tag{position:absolute;z-index:2;top:-18px;left:50%;transform:translateX(-50%) rotate(-2deg);background:var(--ink);color:var(--gold);
  font-weight:900;padding:4px 16px;letter-spacing:.2em;white-space:nowrap;border:3px solid var(--gold)}
.burst{position:relative;width:min(330px,82%);margin:4px auto 0;aspect-ratio:1.18}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst .numwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;padding-top:4%}
.burst .num{font-family:var(--digits);font-size:clamp(100px,24vw,150px);line-height:.8;color:var(--blood);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);letter-spacing:.02em}
.burst .unit{font-weight:900;font-size:clamp(28px,6vw,40px);color:var(--ink);align-self:flex-end;margin-bottom:16%}
.dir{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px auto 0;width:fit-content;
  background:var(--ink);color:var(--gold);padding:8px 22px;transform:skewX(-8deg);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--blood)}
.dir > *{transform:skewX(8deg)}
.dir b{font-weight:900;font-size:clamp(26px,6vw,34px);letter-spacing:.14em}
.dir svg{width:44px;height:44px;flex:none}
.dir.cw svg{animation:orbit 1.6s linear infinite}
.dir.ccw svg{animation:orbit 1.6s linear infinite reverse}
.seq{text-align:center;font-family:var(--digits);font-size:22px;letter-spacing:.04em;margin:12px 0 2px;color:#3b2f2f;word-break:break-word}
.seq em{font-style:normal;color:var(--blood)}
.seq small{display:block;font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.1em;color:#7a6a5a}
.narrator{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center;margin-top:16px}
.narrator .mini{border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg);background:var(--ink)}
.narrator .mini svg{display:block;width:100%;height:auto}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-weight:900;font-size:17px;line-height:1.5;box-shadow:3px 3px 0 var(--ink)}
.bubble::before{content:"";position:absolute;left:-17px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:16px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-11px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:12px solid #fff;border-left:0}
.bubble .who{display:block;font-size:13px;color:var(--blood);letter-spacing:.12em}
.actions{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:900;font-size:18px;padding:8px 18px;letter-spacing:.12em;background:#fff;color:var(--ink)}
.btn.primary{background:var(--blood);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 手機 */
@media (max-width:960px){
  .stage{grid-template-columns:1fr;gap:18px}
  .wheel-zone{order:1;max-width:min(92vw,480px)}
  .roster{order:3;grid-template-columns:repeat(3,1fr);justify-items:center !important;gap:12px}
  .roster .role-card{width:100%;padding:4px 4px 0;box-shadow:4px 4px 0 var(--ink)}
  .role-card b{font-size:15px}
  .role-card span{font-size:11px}
  .controls-slot{order:2}
  .panel{margin-top:4px}
  .speed{inset:-6%;width:112%;height:112%}
  .moon{width:120px;top:6px;right:-28px}
  header{margin-top:4px}

    d += `M100 120 L${100+320*Math.sin(a0)} ${120-320*Math.cos(a0)} L${100+320*Math.sin(a1)} ${120-320*Math.cos(a1)} Z `;
  }
  return `<path d="${d}" fill="${color}" opacity=".55"/>`;
}

/* ───────── 轉盤 ───────── */
const SEG_COLORS = ['#a3202a', '#1b2550'];
const pt = (r, deg) => { const a = deg*Math.PI/180; return `${(r*Math.sin(a)).toFixed(2)} ${(-r*Math.cos(a)).toFixed(2)}`; };
let N = 12;
function buildWheel(n){
  const g = $('#segments'), R = 222, s = 360/n;
  const size = n <= 8 ? 66 : Math.max(24, 66 - (n-8)*2.1);
  const rLabel = n <= 8 ? R*0.7 : R*0.78;
  let html = '';
  for (let i = 0; i < n; i++){
    let fill = SEG_COLORS[i % 2];
    if (n % 2 === 1 && i === n-1) fill = '#5a3a18';
    const a0 = i*s, a1 = (i+1)*s;
    html += `<path class="seg" data-i="${i}" d="M0 0 L${pt(R,a0)} A${R} ${R} 0 ${s > 180 ? 1 : 0} 1 ${pt(R,a1)} Z" fill="${fill}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`;
    html += `<path d="M0 0 L${pt(R*0.98,a0+s*0.08)} A${R*0.98} ${R*0.98} 0 0 1 ${pt(R*0.98,a0+s*0.42)} Z" fill="#fff" opacity=".07"/>`;
    // 6 和 9 加底線（撞球慣例）：轉到倒過來也分得出來
    const under = (i+1 === 6 || i+1 === 9)
      ? `<rect x="${-size*0.26}" y="${-rLabel + size*0.42}" width="${size*0.52}" height="${Math.max(4, size*0.1)}" rx="2" fill="#efe3c8" stroke="${INK}" stroke-width="2.5"/>` : '';
    html += `<g transform="rotate(${a0 + s/2})"><text class="seg-label" y="${-rLabel}" font-size="${size}" stroke-width="${Math.max(5, size/9)}">${i+1}</text>${under}</g>`;
  }
  g.innerHTML = html;
  let studs = '';
  for (let i = 0; i < n; i++){
    studs += `<circle cx="${(229*Math.sin(i*s*Math.PI/180)).toFixed(2)}" cy="${(-229*Math.cos(i*s*Math.PI/180)).toFixed(2)}" r="5" fill="#f5b81c" stroke="${INK}" stroke-width="2.5"/>`;
  }
  $('#studs').innerHTML = studs;
}

/* ───────── 音效（WebAudio 合成，無外部檔） ───────── */
let actx = null, soundOn = true;
function ac(){ if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
// 滴答：木頭棘輪的「喀」——短雜訊經帶通濾波，低音量；最快每 50ms 一聲，轉快時不會連成刺耳的嗡嗡聲
let clickBuf = null, lastTick = 0;
function tick(){
  if (!soundOn) return; const a = ac(); if (!a) return;
  const t = a.currentTime; if (t - lastTick < 0.05) return; lastTick = t;
  if (!clickBuf){
    const len = Math.floor(a.sampleRate * 0.025); clickBuf = a.createBuffer(1, len, a.sampleRate);
    const ch = clickBuf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 4);
  }
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = clickBuf;
  f.type = 'bandpass'; f.frequency.value = 650 + Math.random()*150; f.Q.value = 2.2;
  g.gain.value = 0.35;
  src.connect(f).connect(g).connect(a.destination); src.start(t);
}
function boom(){
  if (!soundOn) return; const a = ac(); if (!a) return; const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  // 「咚」：遠處的悶響——15ms 淡入避免瞬間爆音嚇人，音量壓低
  o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t+0.6);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+0.8);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.85);
  const len = a.sampleRate*0.3, buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random()*2-1) * Math.min(1, i/(a.sampleRate*0.015)) * Math.pow(1 - i/len, 3);
  const n = a.createBufferSource(), ng = a.createGain(), f = a.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 600; n.buffer = buf; ng.gain.value = 0.1;
  n.connect(f).connect(ng).connect(a.destination); n.start(t);
}
function howl(){
  if (!soundOn) return; const a = ac(); if (!a) return; const t = a.currentTime + 0.25;
  const master = a.createGain(); master.gain.setValueAtTime(0.0001, t);
  master.gain.exponentialRampToValueAtTime(0.13, t+0.35); master.gain.setValueAtTime(0.13, t+1.3); master.gain.exponentialRampToValueAtTime(0.0001, t+2.4);
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.8;
  master.connect(f).connect(a.destination);
  [0, 7].forEach(det => {
    const o = a.createOscillator(); o.type = 'sawtooth'; o.detune.value = det;
    o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(620, t+0.5);
    o.frequency.setValueAtTime(620, t+1.2); o.frequency.exponentialRampToValueAtTime(420, t+2.3);
    const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 5.5; lg.gain.value = 9;
    lfo.connect(lg).connect(o.frequency);
    o.connect(master); o.start(t); lfo.start(t); o.stop(t+2.5); lfo.stop(t+2.5);
  });
}

/* ───────── 狀態與儲存 ───────── */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch {} }
};
const input = $('#players');
function clampN(v){ if (v === null || String(v).trim() === '') return null; v = Math.round(Number(v)); return Number.isFinite(v) ? Math.min(MAX, Math.max(MIN, v)) : null; }
function setN(v, fromTyping){
  const c = clampN(v);
  if (c === null){ $('#err').textContent = `請輸入 ${MIN}～${MAX} 的人數`; return false; }
  $('#err').textContent = (fromTyping && Number(v) !== c) ? `人數範圍是 ${MIN}～${MAX}，已調整為 ${c} 人` : '';
  N = c; if (!fromTyping || Number(v) !== c) input.value = c;
  store.set('ww-players', String(c));
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.n) === c)));
  buildWheel(c); hideOrbit();
  return true;
}
$('#minus').onclick = () => !spinning && setN(N - 1);
$('#plus').onclick = () => !spinning && setN(N + 1);
document.querySelectorAll('.chip').forEach(b => b.onclick = () => !spinning && setN(b.dataset.n));
input.addEventListener('change', () => setN(input.value, true));
input.addEventListener('input', () => { const v = Number(input.value); if (input.value !== '' && v >= MIN && v <= MAX && Number.isInteger(v)) setN(v, true); });

const soundBtn = $('#soundBtn');
function renderSound(){
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  soundBtn.setAttribute('aria-label', soundOn ? '音效：開' : '音效：關');
  soundBtn.querySelector('.wave').style.display = soundOn ? '' : 'none';
  soundBtn.querySelector('.mute').style.display = soundOn ? 'none' : '';
}
soundBtn.onclick = () => { soundOn = !soundOn; store.set('ww-sound', soundOn ? '1' : '0'); renderSound(); if (soundOn) tick(); };
soundOn = store.get('ww-sound') !== '0'; renderSound();

/* ───────── 背景音樂（狼頭喇叭） ─────────
   瀏覽器不准「一打開就有聲音」：第一次點畫面任何地方才開始播。
   音量走 WebAudio 的 GainNode——iPhone Safari 的 audio.volume 是唯讀，直接設沒用。 */
const BGM_VOL = 0.2, BGM_DUCK = 0.05;
const bgm = new Audio('bgm.m4a'); bgm.loop = true; bgm.preload = 'auto';
const bgmBtn = $('#bgmBtn'), bgmHint = $('#bgmHint');
let bgmOn = store.get('ww-bgm') !== '0', bgmGain = null, bgmDuckTimer = null;
function bgmNode(){
  if (bgmGain) return bgmGain;
  const a = ac(); if (!a) return null;
  try {
    const src = a.createMediaElementSource(bgm);
    bgmGain = a.createGain(); bgmGain.gain.value = 0;
    src.connect(bgmGain).connect(a.destination);
  } catch { bgmGain = null; }
  return bgmGain;
}
function bgmTo(v, tau){ const g = bgmNode(); if (g) g.gain.setTargetAtTime(v, actx.currentTime, tau); else bgm.volume = v; }
function renderBgm(){
  bgmBtn.classList.toggle('on', bgmOn);
  bgmBtn.classList.toggle('playing', bgmOn && !bgm.paused);
  bgmBtn.setAttribute('aria-pressed', String(bgmOn));
  bgmBtn.setAttribute('aria-label', bgmOn ? '背景音樂：開' : '背景音樂：關');
  bgmHint.hidden = !(bgmOn && bgm.paused);
}
function startBgm(){
  if (!bgmOn) return;
  ac(); bgmNode(); // ac() 會把被暫停的 AudioContext 喚醒
  const p = bgm.play();
  const ok = () => { bgmTo(BGM_VOL, 0.5); renderBgm(); };
  if (p && p.then) p.then(ok).catch(renderBgm); else ok();
}
function stopBgm(){
  bgmTo(0, 0.12);
  setTimeout(() => { if (!bgmOn) { bgm.pause(); renderBgm(); } }, 500);
}
function duckBgm(){ // 揭曉時讓「咚」和狼嚎先講話
  if (!bgmOn || bgm.paused) return;
  clearTimeout(bgmDuckTimer); bgmTo(BGM_DUCK, 0.08);
  bgmDuckTimer = setTimeout(() => { if (bgmOn) bgmTo(BGM_VOL, 0.8); }, 2800);
}
bgmBtn.onclick = () => {
  if (bgmOn && bgm.paused){ startBgm(); return; } // 還沒開始播：這一下當「開始」，不是關掉
  bgmOn = !bgmOn; store.set('ww-bgm', bgmOn ? '1' : '0');
  bgmOn ? startBgm() : stopBgm(); renderBgm();
};
const unlockBgm = e => { if (bgmBtn.contains(e.target)) return; if (bgmOn && bgm.paused) startBgm(); };
document.addEventListener('pointerdown', unlockBgm);
document.addEventListener('keydown', unlockBgm);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (!bgm.paused) bgm.pause(); }
  else if (bgmOn) startBgm();
});
bgm.addEventListener('play', renderBgm); bgm.addEventListener('pause', renderBgm);
renderBgm();
startBgm(); // 有些瀏覽器（之前互動過的網站）允許直接播

/* ───────── 轉動 ───────── */
let rot = 0, spinning = false;
const spinEl = $('#wheelSpin'), zone = $('#wheelZone'), pointer = $('#pointer');
const mod = (a, m) => ((a % m) + m) % m;
const ease = t => 1 - Math.pow(1 - t, 3.4);
function hideOrbit(){ $('#orbit').classList.remove('show','cw','ccw'); document.querySelectorAll('.seg.win').forEach(e => e.classList.remove('win')); const hl = document.getElementById('winHL'); if (hl) hl.remove(); }

function spin(){
  if (spinning) return;
  if (!setN(input.value, true)) return;
  ac();
  spinning = true; hideOrbit(); closeReveal(true);
  $('#spinBtn').disabled = true; $('#spinLabel').textContent = '命運轉動中…';
  zone.classList.add('spinning'); document.body.classList.add('is-spinning', 'blood'); $('#kicker').textContent = '血月升起・命運轉動中';
  const n = N, s = 360/n, pick = randInt(n), dir = randInt(2) === 0 ? 'cw' : 'ccw';
  const center = pick*s + s/2 + (rand01() - 0.5)*s*0.6;
  const start = rot;
  let target = start - mod(start, 360) + 360*6 + mod(-center, 360);
  while (target - start < 360*5.5) target += 360;
  const t0 = performance.now();
  let lastIdx = Math.floor(start / s), finished = false;
  const finish = () => { if (finished) return; finished = true; rot = target; spinEl.style.transform = `rotate(${rot}deg)`; done(pick + 1, dir); };
  setTimeout(finish, SPIN_MS + 40);
  function frame(now){
    if (finished) return;
    const t = Math.min(1, (now - t0) / SPIN_MS);
    rot = start + (target - start) * ease(t);
    spinEl.style.transform = `rotate(${rot}deg)`;
    const idx = Math.floor((rot + s/2) / s);
    if (idx !== lastIdx){ lastIdx = idx; tick(); pointer.animate([{transform:'translateX(-50%) rotate(-16deg)'},{transform:'translateX(-50%) rotate(0deg)'}], {duration:140, easing:'ease-out'}); }
    if (t < 1) requestAnimationFrame(frame); else finish();
  }
  requestAnimationFrame(frame);
}

function done(num, dir){
  spinning = false;
  zone.classList.remove('spinning'); document.body.classList.remove('is-spinning');
  $('#kicker').textContent = '第一夜・天亮了';
  setTimeout(() => document.body.classList.remove('blood'), 1600);
  $('#spinBtn').disabled = false; $('#spinLabel').textContent = '再轉一次';
  const seg = document.querySelector(`.seg[data-i="${num-1}"]`);
  if (seg){ seg.classList.add('win'); const hl = seg.cloneNode(); hl.removeAttribute('class'); hl.id = 'winHL';
    hl.setAttribute('fill', 'none'); hl.setAttribute('stroke', '#f5b81c'); hl.setAttribute('stroke-width', '9'); $('#segments').appendChild(hl); }
  buildOrbit(dir); $('#orbit').classList.add('show', dir);
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  duckBgm(); boom(); howl();
  if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([60, 40, 120]);
  const m = document.querySelector('main'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
  showReveal(num, dir);
}

/* ───────── 揭曉畫面 ───────── */
function burstPoints(rx, ry, spikes, jag){
  const pts = [];
  for (let i = 0; i < spikes*2; i++){
    const a = i/(spikes*2)*Math.PI*2, out = i % 2 === 0;
    const k = out ? 1 - rand01()*0.08 : jag + rand01()*0.08;
    pts.push(`${(Math.cos(a)*rx*k).toFixed(1)},${(Math.sin(a)*ry*k).toFixed(1)}`);
  }
  return pts.join(' ');
}
function arrowPaths(dir){
  // 順時針 270° 圓弧，終點加箭頭；逆時針用左右鏡射
  const r = 14, a0 = 40, a1 = 300, rad = d => d*Math.PI/180;
  const P = a => [r*Math.sin(rad(a)), -r*Math.cos(rad(a))];
  const [sx, sy] = P(a0), [ex, ey] = P(a1);
  const tx = Math.cos(rad(a1)), ty = Math.sin(rad(a1));        // 順時針前進方向
  const nx = Math.sin(rad(a1)), ny = -Math.cos(rad(a1));       // 往外的法線
  const tip = [ex + tx*9, ey + ty*9], b1 = [ex + nx*8, ey + ny*8], b2 = [ex - nx*8, ey - ny*8];
  const f = v => v.toFixed(2);
  return {
    arc: `M${f(sx)} ${f(sy)} A${r} ${r} 0 1 1 ${f(ex)} ${f(ey)}`,
    head: `M${f(tip[0])} ${f(tip[1])} L${f(b1[0])} ${f(b1[1])} L${f(b2[0])} ${f(b2[1])} Z`,
    flip: dir === 'ccw'
  };
}
function sequence(num, dir, n){
  const list = [], step = dir === 'cw' ? 1 : -1;
  for (let k = 0; k < n; k++) list.push(mod(num - 1 + k*step, n) + 1);
  if (n <= 6) return list.map((x,i) => i === 0 ? `<em>${x}</em>` : x).join(' → ');
  return `<em>${list[0]}</em> → ${list[1]} → ${list[2]} → ${list[3]} → … → ${list[n-1]}`;
}
let lastFocus = null;
function showReveal(num, dir){
  const role = ROLES[randInt(ROLES.length)];
  const dirText = dir === 'cw' ? '順時針' : '逆時針';
  $('#burstPoly').setAttribute('points', burstPoints(160, 134, 13, 0.74));
  $('#burstPoly2').setAttribute('points', burstPoints(118, 98, 13, 0.8));
  $('#rNum').textContent = num;
  const ap = arrowPaths(dir), dEl = $('#rDir');
  $('#rDirArrow').setAttribute('d', ap.arc); $('#rDirHead').setAttribute('d', ap.head);
  $('#rDirG').setAttribute('transform', ap.flip ? 'scale(-1 1)' : 'scale(1 1)');
  dEl.className = 'dir ' + dir;
  $('#rDirText').textContent = dirText + '發言';
  $('#rSeq').innerHTML = `${sequence(num, dir, N)}<small>${dir === 'cw' ? '號碼往上數（＋1）' : '號碼往下數（−1）'}</small>`;
  $('#rMini').innerHTML = portrait(role.id);
  $('#rWho').textContent = role.name + '：';
  $('#rLine').textContent = role.line.replace('{n}', num).replace('{d}', dirText);
  $('#live').textContent = `${num} 號開始，${dirText}發言`;
  const last = $('#last'); last.hidden = false;
  last.innerHTML = `本輪：<strong>${num}</strong> 號開始・${dirText}`;
  document.querySelectorAll('.role-card').forEach(c => c.classList.toggle('speaking', c.dataset.role === role.id));
  lastFocus = document.activeElement;
  $('#reveal').hidden = false;
  $('#again').focus({preventScroll:true});
}
function closeReveal(silent){
  const r = $('#reveal'); if (r.hidden) return;
  r.hidden = true;
  if (!silent && lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
$('#close').onclick = () => closeReveal();
$('#again').onclick = () => { closeReveal(true); spin(); };
$('#reveal').addEventListener('click', e => { if (e.target.id === 'reveal') closeReveal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReveal(); });

$('#panel').addEventListener('submit', e => { e.preventDefault(); spin(); });
$('#hub').onclick = spin;

/* ───────── 啟動 ───────── */
const saved = store.get('ww-players');
setN(saved ? (clampN(saved) ?? 12) : 12);
})();
</script>
</body>
